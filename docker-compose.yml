name: opentask

# Start it with:   docker compose up -d --build
# With HTTPS:      docker compose --profile https up -d --build
# Settings come from the .env file next to this one (see .env.example).

x-database-url: &database-url postgresql://${POSTGRES_USER:-opentask}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/${POSTGRES_DB:-opentask}

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-opentask}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-opentask}
    volumes:
      - pgdata:/var/lib/postgresql/data
    # Loopback only: handy for `npm run dev` and psql on the server, invisible to the network.
    ports:
      - '127.0.0.1:${DB_PORT:-5432}:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 5s
      retries: 12

  # Applies the Prisma migrations and exits. The app starts after it succeeds.
  migrate:
    build:
      context: .
      target: migrate
    restart: 'no'
    environment:
      DATABASE_URL: *database-url
    depends_on:
      db:
        condition: service_healthy

  app:
    build:
      context: .
      target: runner
    restart: unless-stopped
    environment:
      DATABASE_URL: *database-url
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:?Set BETTER_AUTH_URL in .env}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?Set BETTER_AUTH_SECRET in .env}
      BETTER_AUTH_TRUSTED_ORIGINS: ${BETTER_AUTH_TRUSTED_ORIGINS:-}
      DISABLE_SIGNUP: ${DISABLE_SIGNUP:-false}
    depends_on:
      migrate:
        condition: service_completed_successfully
    # Plain HTTP. Set APP_BIND to your WireGuard IP to serve it through the VPN. With the https
    # profile leave it on loopback, because Caddy is the way in.
    ports:
      - '${APP_BIND:-127.0.0.1}:${APP_PORT:-3000}:3000'
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/api/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 15s
      timeout: 5s
      start_period: 20s
      retries: 3

  # HTTPS in front of the app. Only runs with `--profile https`.
  caddy:
    profiles: ['https']
    image: caddy:2
    restart: unless-stopped
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?Set APP_DOMAIN in .env to use the https profile}
    ports:
      - '${CADDY_BIND:-127.0.0.1}:${CADDY_HTTP_PORT:-80}:80'
      - '${CADDY_BIND:-127.0.0.1}:${CADDY_HTTPS_PORT:-443}:443'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      app:
        condition: service_healthy

volumes:
  pgdata:
  caddy_data:
  caddy_config:
